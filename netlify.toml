[build]
  command   = "npm run build:site"   # vite build + pre-render del HTML (F08)
  publish   = "dist"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NODE_VERSION = "20"

# Las reescrituras de rutas viven en public/_redirects. Aquí NO va un comodín
# "/*" -> index.html: haría que cualquier URL inexistente devolviera 200.

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

